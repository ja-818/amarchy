<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- amarchy's assistant: a small green imp of a retainer with his staff of
       two heads. Drawn for amarchy; the list's avatar and its notifications'. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3f7a5c"/>
      <stop offset="1" stop-color="#16302a"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd27c"/>
      <stop offset="1" stop-color="#5aa55a"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5a34"/>
      <stop offset="1" stop-color="#6b3a20"/>
    </linearGradient>
  </defs>
  <!-- Round by itself, without a clip (Qt's SVG renderer has none): all of it inside the disc. -->
  <g>
    <circle cx="64" cy="64" r="64" fill="url(#sky)"/>
    <!-- the staff, upright at his side, its two heads on top -->
    <!-- the old man's head: bald, white whiskers -->
    <circle cx="91" cy="27" r="8" fill="#efd9b8" stroke="#3b2a1c" stroke-width="1.4"/>
    <path d="M84.5 30 Q91 38 97.5 30 Q95.5 35.5 91 36.5 Q86.5 35.5 84.5 30 Z" fill="#f4f1ea" stroke="#3b2a1c" stroke-width="1"/>
    <circle cx="88.4" cy="26" r="1.1" fill="#2a1d14"/>
    <circle cx="93.6" cy="26" r="1.1" fill="#2a1d14"/>
    <!-- the woman's head: black hair, a red mouth -->
    <path d="M101 21 q8 -2 10 6 q2 8 -3 12.5 q-5.5 3 -10 -1 q-4.5 -4.5 -2.8 -11 q1.8 -5.5 5.8 -6.5 z" fill="#1d1a22"/>
    <circle cx="104.5" cy="29.5" r="6.6" fill="#f2dcc4" stroke="#3b2a1c" stroke-width="1.3"/>
    <path d="M98.6 26.8 q5.9 -6.5 11.8 0 q-2.8 -2.3 -5.9 -1.9 q-3.6 0 -5.9 1.9 z" fill="#1d1a22"/>
    <circle cx="102.5" cy="29.2" r="0.95" fill="#2a1d14"/>
    <circle cx="106.6" cy="29.2" r="0.95" fill="#2a1d14"/>
    <path d="M103.2 32.8 q1.4 0.9 2.8 0" stroke="#c03a3a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- his robe -->
    <path d="M26.7 116 Q32 92 64 88 Q96 92 101.3 116 A64 64 0 0 1 26.7 116 Z" fill="url(#robe)" stroke="#3d2214" stroke-width="2"/>
    <path d="M50 90 L64 108 L78 90" fill="none" stroke="#e8c770" stroke-width="3" stroke-linejoin="round"/>
    <path d="M64 108 L64 127" stroke="#3d2214" stroke-width="1.5"/>
    <!-- the pole of the staff, from his hand up to the heads -->
    <path d="M98 117 L98 37 L91 35 M98 37 L104 36" stroke="#5b3b22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M98 117 L98 38" stroke="#8a5f3a" stroke-width="1.8" stroke-linecap="round"/>
    <!-- ears -->
    <path d="M33 56 L20 47 L36 66 Z" fill="#6cb865" stroke="#2f5a2c" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M95 56 L108 47 L92 66 Z" fill="#6cb865" stroke="#2f5a2c" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- head -->
    <path d="M64 34 C86 34 96 48 95 64 C94 80 82 90 64 90 C46 90 34 80 33 64 C32 48 42 34 64 34 Z"
          fill="url(#skin)" stroke="#2f5a2c" stroke-width="2"/>
    <!-- a small black cap -->
    <path d="M50 38 Q52 18 66 14 Q74 13 74 22 Q74 30 78 37 Q64 31 50 38 Z" fill="#1b1d1f" stroke="#000" stroke-width="1"/>
    <path d="M52 37 Q64 32 77 36" stroke="#3a3d40" stroke-width="1.5" fill="none"/>
    <!-- eyes, big and yellow -->
    <circle cx="51" cy="58" r="11" fill="#ffd94a" stroke="#2f5a2c" stroke-width="2"/>
    <circle cx="77" cy="58" r="11" fill="#ffd94a" stroke="#2f5a2c" stroke-width="2"/>
    <circle cx="53" cy="59" r="4.2" fill="#14110d"/>
    <circle cx="75" cy="59" r="4.2" fill="#14110d"/>
    <circle cx="54.4" cy="57.4" r="1.3" fill="#fff"/>
    <circle cx="76.4" cy="57.4" r="1.3" fill="#fff"/>
    <!-- brows, busy -->
    <path d="M41 45 L58 49" stroke="#2f5a2c" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M87 45 L70 49" stroke="#2f5a2c" stroke-width="2.6" stroke-linecap="round"/>
    <!-- a beak of a mouth -->
    <path d="M55 72 Q64 66 73 72 Q70 82 64 83 Q58 82 55 72 Z" fill="#c9e07a" stroke="#2f5a2c" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M56.5 74 Q64 77.5 71.5 74" stroke="#2f5a2c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- his hand on the staff -->
    <path d="M84 104 Q90 96 98 97" stroke="#6b3a20" stroke-width="9" stroke-linecap="round" fill="none"/>
    <ellipse cx="98" cy="99" rx="6" ry="6.5" fill="#6cb865" stroke="#2f5a2c" stroke-width="1.8"/>
    <path d="M93 96.5 L103 96.5 M93 101 L103 101" stroke="#2f5a2c" stroke-width="1.2"/>
  </g>
</svg>
