# The desktop app (desktop/): built and tested on Linux (x86_64 and aarch64,
# as Julian's Omarchy on Apple Silicon is), macOS and Windows. Its packages
# (deb, rpm, AppImage; dmg; the Windows installer) are kept as this run's
# artifacts, for trying, not published.
name: Desktop app

on:
  push:
    branches: [main]
    paths: ["desktop/**", "app/**", "bin/amarchy", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "app/**", "bin/amarchy", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04, linux: true, window: true }
          - { name: Linux aarch64, os: ubuntu-24.04-arm, linux: true }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: What Linux needs to build it
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf build-essential pkg-config file \
            gstreamer1.0-plugins-good gstreamer1.0-pipewire

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Unit tests
        run: cargo test --locked

      - name: Its packages
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --ci

      - name: The real window (Xvfb)
        if: matrix.window
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick dbus tmux xclip
          cargo build --locked --features test-hooks
          SHOTS="$RUNNER_TEMP/shots" python3 test/shell-test.py

      - name: Screenshots
        if: matrix.window && always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: Keep its packages
        uses: actions/upload-artifact@v4
        with:
          name: amarchy-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/rpm/*.rpm
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
